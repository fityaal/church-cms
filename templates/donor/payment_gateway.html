{% extends 'base.html' %}
{% block title %}Complete Payment{% endblock %}
{% block page_title %}Complete Your Donation{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="fcard text-center">
      <div style="font-size:40px;margin-bottom:16px;">💳</div>
      <h5>Complete Your Donation</h5>
      <p style="font-size:13px;color:#64748b;">Receipt: <code>{{ donation.receipt_number }}</code></p>
      <div style="font-size:28px;font-weight:700;color:#166534;margin:16px 0;">₹{{ "{:,.2f}".format(total) }}</div>
      <button id="rzp-button" class="btn btn-gold w-100" style="padding:14px;font-size:16px;font-weight:700;"><i class="bi bi-credit-card me-2"></i>Pay Now</button>
      <div class="mt-3">
        <form method="POST" action="{{ url_for('payment.cancel', did=donation.id) }}">
          <button type="submit" class="btn btn-outline-secondary btn-sm" onclick="return confirm('Cancel this payment?')">Cancel</button>
        </form>
      </div>
      <p style="font-size:11px;color:#94a3b8;margin-top:16px;">Secured by Razorpay &nbsp;🔒</p>
    </div>
  </div>
</div>
<form id="verifyForm" method="POST" action="{{ url_for('payment.verify') }}" style="display:none;">
  <input type="hidden" name="razorpay_order_id" id="rz_order"/>
  <input type="hidden" name="razorpay_payment_id" id="rz_payment"/>
  <input type="hidden" name="razorpay_signature" id="rz_sig"/>
</form>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const options={
  key:'{{ razorpay_key }}', amount:{{ (total*100)|int }}, currency:'INR',
  name:"All Saints' Cathedral, Nagpur", description:'{{ donation.receipt_number }}',
  order_id:'{{ order.id }}',
  handler:function(r){
    document.getElementById('rz_order').value=r.razorpay_order_id;
    document.getElementById('rz_payment').value=r.razorpay_payment_id;
    document.getElementById('rz_sig').value=r.razorpay_signature;
    document.getElementById('verifyForm').submit();
  },
  prefill:{name:'{{ current_user.full_name }}', contact:'{{ current_user.mobile }}',email:'{{ current_user.email or "" }}'},
  theme:{color:'#1a2e5a'}
};
document.getElementById('rzp-button').onclick=function(e){e.preventDefault();new Razorpay(options).open();};
</script>
{% endblock %}
