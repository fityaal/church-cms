{% extends 'base.html' %}
{% block title %}Add Bank Account{% endblock %}
{% block page_title %}Add Bank Account{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="fcard">
  <h6 class="fw-bold mb-4" style="color:var(--navy);"><i class="bi bi-bank me-2"></i>New Bank Account</h6>
  <form method="POST">
    <div class="row g-3">
      <div class="col-12"><label class="form-label">Account Name *</label><input type="text" name="account_name" class="form-control" required placeholder="e.g. General Fund Account"/></div>
      <div class="col-md-6"><label class="form-label">Bank Name *</label><input type="text" name="bank_name" class="form-control" required/></div>
      <div class="col-md-6"><label class="form-label">Account Number *</label><input type="text" name="account_number" class="form-control" required/></div>
      <div class="col-md-6"><label class="form-label">IFSC Code</label><input type="text" name="ifsc_code" class="form-control"/></div>
      <div class="col-md-6"><label class="form-label">Branch</label><input type="text" name="branch" class="form-control"/></div>
      <div class="col-12"><label class="form-label">Opening Balance (₹)</label><input type="number" name="opening_balance" class="form-control" value="0" min="0" step="0.01"/></div>
      <div class="col-12"><button type="submit" class="btn btn-navy w-100"><i class="bi bi-save me-2"></i>Add Bank Account</button></div>
    </div>
  </form>
</div></div></div>
{% endblock %}
