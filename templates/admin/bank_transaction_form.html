{% extends 'base.html' %}
{% block title %}Add Transaction{% endblock %}
{% block page_title %}Add Bank Transaction{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="fcard">
  <h6 class="fw-bold mb-4" style="color:var(--navy);"><i class="bi bi-arrow-left-right me-2"></i>{{ account.account_name }}</h6>
  <div class="alert alert-info py-2 mb-4" style="font-size:13px;">Current Balance: <strong>₹{{ "{:,.2f}".format(account.current_balance) }}</strong></div>
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Date *</label><input type="date" name="txn_date" class="form-control" value="{{ today }}" required/></div>
      <div class="col-md-6"><label class="form-label">Type *</label>
        <select name="txn_type" class="form-select" required>
          {% for t in txn_types %}<option value="{{ t.name }}">{{ t.value }}</option>{% endfor %}
        </select></div>
      <div class="col-12"><label class="form-label">Amount (₹) *</label><input type="number" name="amount" class="form-control" min="0.01" step="0.01" required/></div>
      <div class="col-12"><label class="form-label">Description *</label><input type="text" name="description" class="form-control" required/></div>
      <div class="col-12"><label class="form-label">Reference</label><input type="text" name="reference" class="form-control" placeholder="Cheque/UTR no."/></div>
      <div class="col-12"><button type="submit" class="btn btn-navy w-100"><i class="bi bi-save me-2"></i>Save Transaction</button></div>
    </div>
  </form>
</div></div></div>
{% endblock %}
